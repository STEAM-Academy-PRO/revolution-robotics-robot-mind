<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Revolution Robotics</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="rr-logo-white.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button class="logo-btn" id="connectBtn">
        <div class="logo-placeholder" id="logo">
            <img src="rr-logo-white.svg" class="logo">
        </div>
        <div class="connect-text">
            Connect to my Revolution Robotics Brain
            <div style="font-size: 0.9rem; color: #aaa; margin-top: 1rem;" id="info">
                Make sure that your brain is connected to the same network as your computer/tablet
            </div>
        </div>
        <div id="error"></div>

        <span id="manualConnectBtn" class="btn">
            Connect
        </span>

    </button>

    <div id="lastBrain">

    </div>

    <div class="form">
        <button class="btn first-time" id="firstTimeSetupBtn">
            WIFI setup
        </button>

        <div class="toggle-container" id="toggleContainer">
            <div id="previous-wifi-access-points"></div>
            <div class="margin-top-40">
                <form onsubmit="return false;">
                    <label>Add new WiFi:</label>
                    <input
                        type="text"
                        placeholder="e.g. Home WiFi"
                        style="margin-top:1rem; padding:0.5rem 1rem;"
                        id="wifiSsid"
                    >
                    <input
                        type="password"
                        placeholder="e.g. password123"
                        style="margin-top:0.5rem; padding:0.5rem 1rem;"
                        id="wifiPassword">

                    <button
                        type="button"
                        id="sendWifiBtn"
                        class="btn"
                        >
                        Send down WIFI credentials
                    </button>
                </form>
            </div>
        </div>
    </div>
    <script src="rc-connector.js"></script>
