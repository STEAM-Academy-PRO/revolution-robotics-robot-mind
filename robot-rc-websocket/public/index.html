<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Revolution Robotics</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="rr-logo-white.svg" type="image/svg+xml">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            width: 100vw;
            height: 100vh;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white
        }
        .logo-btn {
            background: none;
            border: none;
            outline: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2rem;
        }
        .logo-btn:hover .logo-placeholder {
            box-shadow: 0 0 20px #0ff;
        }
        .logo-placeholder {
            width: 160px;
            height: 160px;
            background: #222;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #888;
            margin-bottom: 1rem;
            border: 2px solid #444;
            transition: box-shadow 0.2s;
        }
        .logo-btn:active .logo-placeholder {
            box-shadow: 0 0 20px #0ff;
        }
        .connect-text {
            font-size: 2rem;
            text-align: center;
            letter-spacing: 1px;
            color: white;
        }
        .logo{
            height: 100px;
        }
    </style>
</head>
<body>
    <button class="logo-btn" id="connectBtn">
        <div class="logo-placeholder">
            <img src="rr-logo-white.svg" class="logo">
        </div>
        <div class="connect-text">
            Connect to my Brain
            <div style="font-size: 0.9rem; color: #aaa; margin-top: 1rem;" id="info">
                Make sure that your brain is connected to the same network as your computer/tablet
            </div>
        </div>
        <div id="error"></div>
    </button>

    <div style="margin-top:2rem; display:flex; flex-direction:column; align-items:center;">
        <label for="brainIdInput" style="color:#aaa; font-size:1rem; margin-bottom:0.5rem;">
            ...or type in the brain ID
        </label>
        <input
            id="brainIdInput"
            type="text"
            maxlength="8"
            autocomplete="off"
            style="background:#181818; color:#fff; border:1.5px solid #444; border-radius:6px; padding:0.5rem 1rem; font-size:1.2rem; text-align:center; outline:none; width:160px;"
            placeholder="e.g. 123ABC"
        >
        <button
            id="manualConnectBtn"
            style="margin-top:1rem; padding:0.5rem 1.5rem; font-size:1.1rem; border-radius:6px; border:none; background:#0ff; color:#000; cursor:pointer;"
        >
            Connect
        </button>
    </div>
    <div style="margin-top:2rem; display:flex; flex-direction:column; align-items:center;">
        <p>
            <label>Configure wireless on the Revolution Brain:</label>
        </p>
        <input
            type="text"
            placeholder="e.g. Home WiFi"
            style="margin-top:1rem; padding:0.5rem 1rem;"
            id="wifiSsid"
        >
        <input
            type="password"
            placeholder="e.g. password123"
            style="margin-top:0.5rem; padding:0.5rem 1rem;"
            id="wifiPassword">

        <button
            id="connectBtn"
            onclick="sendDownWlanCredentials()"
            style="margin-top:1rem; padding:0.5rem 1.5rem; font-size:1.1rem; border-radius:6px; border:none; background:#0ff; color:#000; cursor:pointer;"
        >
            Send down WIFI credentials
        </button>

    </div>
    <script>
        document.onload = function() {
            const brainId = localStorage.getItem('brainId');
            if (brainId) {
                document.getElementById('brainIdInput').value = brainId;
            }
        };
        window.addEventListener('DOMContentLoaded', function() {
            // Restore brainId
            const brainId = localStorage.getItem('brainId');
            if (brainId) {
                document.getElementById('brainIdInput').value = brainId;
            }
            // Restore WiFi SSID and password
            const ssid = localStorage.getItem('wifiSsid');
            const pwd = localStorage.getItem('wifiPassword');
            if (ssid) document.getElementById('wifiSsid').value = ssid;
            if (pwd) document.getElementById('wifiPassword').value = pwd;
        });

        // Save WiFi SSID and password on change
        document.getElementById('wifiSsid').addEventListener('input', function(e) {
            localStorage.setItem('wifiSsid', e.target.value);
        });
        document.getElementById('wifiPassword').addEventListener('input', function(e) {
            localStorage.setItem('wifiPassword', e.target.value);
        });
        document.getElementById('brainIdInput').addEventListener('input', function(e) {
            const val = e.target.value.trim();
            if (val.length === e.target.maxLength) {
                localStorage.setItem('brainId', val);
                window.location.href = `http://${val}-rr.local:8000`;
            }
        });
        document.getElementById('manualConnectBtn').addEventListener('click', function() {
            const input = document.getElementById('brainIdInput');
            const val = input.value.trim();
            if (val) {
                localStorage.setItem('brainId', val);
                window.location.href = `http://${val}-rr.local:8000`;
            }
        });

        let connecting = false
        let device, server;

        const liveMessageServiceUUID = 'd2d5558c-5b9d-11e9-8647-d663bd873d93';
        // const liveMessageServiceUUID = '97148a03-5b9d-11e9-8647-d663bd873d93';

        const revvyBleWlanServiceUUID = "12345678-1234-5678-1234-56789abcdef0";
        const lanIpServiceUUID = '12345678-1234-5678-1234-56789abcdef2';
        // const wlanCredentialsServiceUUID = '12345678-1234-5678-1234-56789abcdef2'
        // const wlanStatusServiceUUID = '12345678-1234-5678-1234-56789abcdef3'

        // I am using this here, so that the old brains are also visible.

        async function sendDownWlanCredentials(){
            if (!device) {
                await connectBluetooth()
            }
            if (device && device.gatt.connected) {
                console.log('Bluetooth device disconnected.');
                // Send SSID and password to the BLE device
                const ssid = localStorage.getItem('wifiSsid') || '';
                const password = localStorage.getItem('wifiPassword') || '';
                const credentialsService = await server.getPrimaryService(liveMessageServiceUUID);
                const credentialsCharacteristic = await credentialsService.getCharacteristic(wlanCredentialsServiceUUID);

                // Format: SSID and password separated by a null byte
                const encoder = new TextEncoder();
                const credentialsData = encoder.encode(`${ssid}\0${password}`);
                await credentialsCharacteristic.writeValue(credentialsData);
                console.log('Sent WiFi credentials over BLE.');
            }

        }

        async function connectBluetooth() {
            if (connecting) return; // Prevent multiple clicks
            connecting = true;

            document.getElementById('error').innerHTML = '';

            if (!navigator.bluetooth) {
                document.getElementById('error').innerHTML = 'Bluetooth not supported in this browser.';
                return;
            }
            // try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{services: ['d2d5558c-5b9d-11e9-8647-d663bd873d93']}],
                    optionalServices: ['12345678-1234-5678-1234-56789abcdef0', '97148a03-5b9d-11e9-8647-d663bd873d93']
                });


                server = await device.gatt.connect();

                // const services = await server.getPrimaryServices();
                // console.log('Available services:');
                // for (const svc of services) {
                //     console.log(`Service UUID: ${svc.uuid}`);
                // }

                const service = await server.getPrimaryService('12345678-1234-5678-1234-56789abcdef0');
                const characteristic = await service.getCharacteristic(lanIpServiceUUID);
                const value = await characteristic.readValue();
                const decoder = new TextDecoder('utf-8');
                const ip = decoder.decode(value);

                console.log('Robot IP Address:', ip);
                document.getElementById('info').innerHTML = `Your RR Brain's IP is ${ip}, redirecting...`

                if (ip){
                    // window.location.href = `https://${ip}:8433?address=${ip}`;
                    console.log('Redirecting to:', `http://${ip}:8000`);
                    // await device.gatt.disconnect();
                }
                // if (device && device.name) {
                //     window.location.href = `http://${device.name}-rr.local:8000`;
                // }
            // } catch (err) {
            //     // User cancelled or error
            //     console.error('Bluetooth connection failed:', err);
            //     document.getElementById('error').innerHTML = `
            //         <div style="color: red; font-size: 1.5rem; text-align: center;">
            //             Failed to connect to Bluetooth device.<br>
            //             Please ensure Bluetooth is enabled and try again.
            //         </div>
            //     `;
            // }
            // finally {
            //     connecting = false;
            // }
        }

        document.getElementById('connectBtn').addEventListener('click', connectBluetooth);
    </script>
</body>
</html>
